spring.config.import=optional:file:.env[.properties]

# Nombre de la aplicación
spring.application.name=relicsearch-backend

# Puerto del servidor backend
server.port=8080

# Conexión a Base de Datos inyectada desde el archivo .env
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate
# 'update' creará o actualizará las tablas automáticamente según nuestras entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Spring Security con JWT
jwt.secret=${JWT_SECRET}

# Cambiamos la llave por la de Groq
openai.api.key=${GROQ_API_KEY}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect